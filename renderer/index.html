<!doctype html>
<meta charset="utf-8">
<title>Deskmate</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #buddy { position: absolute; left: 0; top: 0; cursor: pointer; user-select: none; }
  #bubble { position: absolute; max-width: 260px; padding: 10px 12px; border-radius: 14px;
            background: #fff; color: #222; font: 14px/1.35 "Segoe UI", sans-serif;
            box-shadow: 0 2px 10px rgba(0,0,0,.3); user-select: none; }
  #bubble .buttons { display: flex; gap: 8px; margin-top: 8px; }
  #bubble .buttons:empty { display: none; }
  #bubble button { border: 0; border-radius: 8px; padding: 4px 12px; font: inherit; cursor: pointer;
                   background: #ff9f1c; color: #222; }
  #bubble button + button { background: #e6e6ea; }
</style>
<div id="buddy"></div>
<script type="module" src="main.js"></script>
